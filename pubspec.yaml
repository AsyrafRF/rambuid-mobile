name: rambu_idv2
description: "Aplikasi pengenalan rambu jalan raya Indonesia"
publish_to: 'none'
version: 1.2.0+4

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.14.0
  google_fonts: ^6.2.1
  cloud_firestore: ^5.6.9
  image_picker: ^1.1.2
  mjpeg_view: ^1.0.1
  shared_preferences: ^2.5.3
  firebase_auth: ^5.6.0
  google_sign_in: ^6.3.0
  connectivity_plus: ^6.1.4
  shimmer: ^3.0.0
  http: ^1.4.0
  lottie: ^3.3.1
  intl: ^0.20.2
  font_awesome_flutter: ^10.8.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/images/
    - assets/icons/
    - assets/icons/ikon_webcam.png
    - assets/icons/google.png
    - assets/logo.png
    - assets/animations/no_data.json
    - assets/gifs/no_data.gif

  uses-material-design: true

flutter_native_splash:
  color: "#ffffff"
  image: assets/images/rambu_logo.png
  branding: assets/images/rambu_branding.png
  android: true
  ios: true
  fullscreen: true

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icons/app_icon.png"